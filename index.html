<!doctype html>
<html lang="id" data-theme="coinbase">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7132f5" />
    <meta name="description" content="Financial Tracker V2 - Crypto-grade personal finance tracker inspired by Kraken Design System." />
    
    <title>💰 Financial Tracker</title>

    <!--
      Applies the saved theme before first paint.
      Without this the page renders one frame with the default theme and then
      snaps to the user's choice (a visible flash of the wrong colours).
      Inline on purpose: a module script would run after the first paint.
    -->
    <script>
      (function () {
        try {
          var systems = ['coinbase', 'theverge', 'kraken', 'autumn', 'mongodb'];
          var saved = localStorage.getItem('ft_design_system');
          var system = systems.indexOf(saved) >= 0 ? saved : 'coinbase';
          document.documentElement.setAttribute('data-theme', system);

          var mode = localStorage.getItem('ft_theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || ((!mode || mode === 'system') && prefersDark);
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable: fall back to the markup defaults. */
        }
      })();
    </script>

    <!--
      Fonts: only the Kraken baseline is render-blocking (it is the default
      theme). Every other design system loads its family on demand from the
      theme provider, so first paint no longer waits on eight families.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Financial Tracker" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
