<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Canvas (100% full bleed, edge-to-edge, zero border-radius) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#0a0c13"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>

    <!-- Signature Brand Violet Gradient (Financial Tracker V2) -->
    <linearGradient id="brandViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#935df8"/>
      <stop offset="40%" stop-color="#7132f5"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Electric Blue Accent -->
    <linearGradient id="brandCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Mint Growth Arrow (Cashflow & Prosperity) -->
    <linearGradient id="growthMint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Square Background: Zero rounded corners, zero borders -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Optically Centered 2D Fintech Emblem -->
  <g transform="translate(14, 0)">
    <!-- 1. Seamless Architectural 'F' Body -->
    <path d="
      M 170 144
      L 334 144
      C 344 144 352 152 352 162
      C 352 172 344 180 334 180
      L 200 180
      L 200 236
      L 276 236
      C 286 236 294 244 294 254
      C 294 264 286 272 276 272
      L 200 272
      L 200 350
      C 200 360 192 368 182 368
      C 172 368 164 360 164 350
      L 164 162
      C 164 152 172 144 182 144
      Z
    " fill="url(#brandViolet)"/>

    <!-- 2. Dynamic Ascending Growth Vector (Flat 2D Arrow) -->
    <path d="M 234 346 L 338 242" 
          stroke="url(#growthMint)" 
          stroke-width="26" 
          stroke-linecap="round"/>

    <!-- Chevron Arrowhead -->
    <path d="M 290 242 L 338 242 L 338 290" 
          fill="none" 
          stroke="url(#growthMint)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Precision Financial Tracking Node -->
    <circle cx="344" cy="346" r="13" fill="url(#brandCyan)"/>
  </g>
</svg>