<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161724"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    
    <!-- Metallic Rim Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#707694" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2d3042" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#12131b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- F Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="100%" x2="60%" y2="0%">
      <stop offset="0%" stop-color="#3cffd0"/>
      <stop offset="50%" stop-color="#7132f5"/>
      <stop offset="100%" stop-color="#0052ff"/>
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7132f5"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>

    <!-- Coin Disc Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3cffd0"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#026b3f"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Dark Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="6"/>

  <!-- Glowing Emblem Group -->
  <g filter="url(#neonGlow)">
    <!-- 3D Coin Disc (Bottom Right) -->
    <ellipse cx="304" cy="324" rx="72" ry="38" fill="url(#coinGrad)" transform="rotate(-25 304 324)"/>
    <ellipse cx="304" cy="314" rx="68" ry="34" fill="#132420" transform="rotate(-25 304 314)"/>
    <ellipse cx="304" cy="314" rx="64" ry="30" fill="url(#coinGrad)" fill-opacity="0.9" transform="rotate(-25 304 314)"/>

    <!-- Stylized 'F' Ribbon & Ascending Growth Path -->
    <path d="M168 348 L168 252 C168 226 188 206 214 206 L290 206 C304 206 316 194 316 180 C316 166 304 154 290 154 L196 154 C168 154 144 178 144 206 L144 348 Z" fill="url(#ribbonGrad)"/>
    <path d="M168 268 C168 250 184 236 202 236 L276 236 C298 236 318 224 330 204 L356 164" fill="none" stroke="url(#arrowGrad)" stroke-width="28" stroke-linecap="round"/>
    <polygon points="340,132 386,148 358,194" fill="#0066ff"/>
  </g>
</svg>